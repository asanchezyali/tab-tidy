<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tab Tidy</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="popup">
    <header>
      <img src="../../icons/icon-32.png" alt="" width="20" height="20" />
      <h1>Tab Tidy</h1>
    </header>

    <label class="toggle">
      <input type="checkbox" id="blockDuplicates" />
      <span>Switch to the open tab instead of opening a duplicate</span>
    </label>
    <label class="toggle">
      <input type="checkbox" id="autoSort" />
      <span>Keep tabs sorted by URL automatically</span>
    </label>

    <p id="status" class="status">Checking this window…</p>

    <div class="actions">
      <button id="closeDuplicates" type="button">Close duplicates</button>
      <button id="sortTabs" type="button">Sort tabs by URL</button>
    </div>

    <footer>
      <a href="#" id="openOptions">Settings</a>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
